<title>Tarun Bonu, Mantel Technical Interview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #F6F7F9; --surface: #FFFFFF; --surface-sunken: #ECEEF1;
    --ink: #14181C; --ink-muted: #52606B; --ink-faint: #8A96A0;
    --accent: #C23B22; --accent-deep: #9B2E19; --accent-soft: #F6DFD7;
    --line: #DCE0E4;
    --pro: #1F3A5F; --pro-soft: #E3E9F1;
    --per: #2F6B4F; --per-soft: #E1EEE6;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Work Sans', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.5; }

  .deck { position: fixed; inset: 0; overflow: hidden; }
  .track { display: flex; height: 100%; transition: transform 0.55s cubic-bezier(.65,0,.35,1); }
  .slide { flex: 0 0 100vw; height: 100%; position: relative; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .slide.centered { display: flex; align-items: center; justify-content: center; padding: clamp(1.5rem, 5vw, 5rem); }

  /* ---------- Progress + counter ---------- */
  .progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 20; transition: width 0.5s cubic-bezier(.65,0,.35,1); }
  .counter { position: fixed; top: 1.3rem; right: 1.6rem; font-family: var(--font-body); font-size: 0.82rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; z-index: 20; }

  /* ---------- Nav ---------- */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 20;
    width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px -10px rgba(20,24,28,0.25); transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .nav-btn:hover { transform: translateY(-50%) scale(1.08); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; pointer-events: none; }
  .nav-prev { left: 1.4rem; }
  .nav-next { right: 1.4rem; }

  .dots { position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.5rem; z-index: 20; }
  .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--line); border: none; cursor: pointer; padding: 0; transition: background 0.2s ease, transform 0.2s ease; }
  .dot.active { background: var(--accent); transform: scale(1.4); }

  .home-btn {
    position: fixed; top: 1.2rem; left: 1.6rem; z-index: 20; background: none; border: none;
    font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; color: var(--ink);
    cursor: pointer; display: flex; align-items: center; gap: 0.4rem; opacity: 0.85; transition: opacity 0.15s ease;
  }
  .home-btn:hover { opacity: 1; }
  .home-btn.hidden { display: none; }

  /* ---------- Title slide ---------- */
  .title-slide { text-align: center; }
  .eyebrow { font-family: var(--font-body); font-size: 0.8rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-deep); font-weight: 600; margin-bottom: 1rem; }
  .title-slide h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.6rem, 7vw, 4.6rem); margin: 0 0 1.1rem; line-height: 1.02; text-wrap: balance; letter-spacing: -0.01em; }
  .title-slide .sub { font-size: clamp(1.05rem, 2vw, 1.3rem); color: var(--ink-muted); max-width: 46ch; margin: 0 auto; }
  .title-hint { margin-top: 1.6rem; font-size: 0.85rem; color: var(--ink-faint); font-family: var(--font-body); }

  .category-row { display: flex; gap: 1.2rem; justify-content: center; margin-top: 2.6rem; flex-wrap: wrap; }
  .category-card {
    width: clamp(220px, 30vw, 280px); text-align: left; background: var(--surface);
    border: 1px solid var(--line); border-radius: 18px; padding: 1.6rem 1.7rem; cursor: pointer;
    font-family: var(--font-body); color: inherit;
    transition: transform 0.2s cubic-bezier(.2,.7,.3,1), box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .category-card:hover, .category-card:focus-visible { transform: translateY(-5px); box-shadow: 0 16px 34px -16px rgba(20,24,28,0.32); outline: none; }
  .category-card.pro:hover { border-color: var(--pro); }
  .category-card.per:hover { border-color: var(--per); }
  .category-card .tag { margin-bottom: 0.7rem; }
  .category-card h3 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; margin: 0 0 0.4rem; }
  .category-card p { font-size: 0.88rem; color: var(--ink-muted); margin: 0 0 0.9rem; }
  .category-card .count { font-size: 0.78rem; color: var(--ink-faint); font-weight: 600; }
  .category-card .arrow { float: right; opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; }
  .category-card:hover .arrow { opacity: 1; transform: translateX(3px); }

  /* ---------- Hub slide: the three parts of the session ---------- */
  .hub-slide { text-align: center; }
  .hub-slide h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.2rem, 5.4vw, 3.6rem); margin: 0 0 0.9rem; line-height: 1.04; letter-spacing: -0.01em; text-wrap: balance; }
  .hub-slide .sub { font-size: clamp(1rem, 1.8vw, 1.18rem); color: var(--ink-muted); max-width: 52ch; margin: 0 auto; }
  .hub-row { display: flex; gap: 1.2rem; justify-content: center; margin-top: 2.8rem; flex-wrap: wrap; }
  .part-card {
    position: relative; display: flex; flex-direction: column; text-align: left;
    width: clamp(230px, 27vw, 300px); background: var(--surface);
    border: 1px solid var(--line); border-radius: 18px; padding: 1.7rem 1.7rem 1.5rem;
    cursor: pointer; font-family: var(--font-body); color: inherit; text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .part-card:hover, .part-card:focus-visible { transform: translateY(-5px); box-shadow: 0 16px 34px -16px rgba(20,24,28,0.32); border-color: var(--accent); outline: none; }
  .part-card .part-num {
    font-family: var(--font-display); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em;
    color: var(--accent-deep); background: var(--accent-soft); align-self: flex-start;
    padding: 0.2rem 0.55rem; border-radius: 100px; margin-bottom: 0.9rem;
  }
  .part-card h3 { font-family: var(--font-display); font-size: 1.32rem; font-weight: 600; margin: 0 0 0.4rem; line-height: 1.16; }
  .part-card p { font-size: 0.88rem; color: var(--ink-muted); margin: 0 0 1.1rem; line-height: 1.5; }
  .part-card .part-go { margin-top: auto; font-size: 0.78rem; font-weight: 600; color: var(--accent-deep); display: flex; align-items: center; gap: 0.35rem; }
  .part-card .part-go .arrow { transition: transform 0.2s ease; }
  .part-card:hover .part-go .arrow { transform: translateX(4px); }
  .part-card .ext { font-size: 0.7rem; font-weight: 600; color: var(--ink-faint); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 0.45rem; }
  .hub-hint { margin-top: 2rem; font-size: 0.85rem; color: var(--ink-faint); }

  /* ---------- Project slide: fold + deep dive ---------- */
  .slide-inner { max-width: 1160px; margin: 0 auto; width: 100%; padding: clamp(1.5rem, 5vw, 5rem); }
  .fold { min-height: calc(100vh - 2px); display: flex; flex-direction: column; justify-content: center; }

  .slide-head { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 1.1rem; }
  .icon-badge { width: 3rem; height: 3rem; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-badge.pro { background: var(--pro-soft); color: var(--pro); }
  .icon-badge.per { background: var(--per-soft); color: var(--per); }
  .tag { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.25rem 0.65rem; border-radius: 100px; }
  .tag.pro { background: var(--pro-soft); color: var(--pro); }
  .tag.per { background: var(--per-soft); color: var(--per); }

  .slide h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2rem, 4.4vw, 3.1rem); margin: 0 0 1.6rem; line-height: 1.04; text-wrap: balance; }

  .body-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: clamp(1.5rem, 3vw, 3.5rem); align-items: start; }

  .narrative h4 { font-family: var(--font-body); font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 1.1rem 0 0.4rem; }
  .narrative h4:first-child { margin-top: 0; }
  .narrative p, .narrative li { font-size: clamp(0.94rem, 1.2vw, 1.05rem); color: var(--ink); margin: 0 0 0.35rem; }
  .narrative ul { margin: 0; padding-left: 1.2rem; }

  .key-decision { background: linear-gradient(135deg, var(--accent-soft), transparent 140%); border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; padding: 0.9rem 1.1rem; margin: 1rem 0; }
  .key-decision .label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 0.3rem; }
  .key-decision p { margin: 0; font-family: var(--font-display); font-size: clamp(0.98rem, 1.3vw, 1.12rem); color: var(--ink); }

  .metric-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.5rem 1.6rem; }
  .headline-metric { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 5vw, 3.2rem); color: var(--accent-deep); font-variant-numeric: tabular-nums; line-height: 1; }
  .headline-metric-label { font-size: 0.86rem; color: var(--ink-muted); margin: 0.35rem 0 1.2rem; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-bottom: 1.2rem; }
  .stat-card { background: var(--surface-sunken); border-radius: 10px; padding: 0.7rem 0.85rem; }
  .stat-value { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat-label { font-size: 0.74rem; color: var(--ink-muted); margin-top: 0.15rem; }

  .tech-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .tech-pill { font-size: 0.76rem; font-weight: 600; color: var(--ink-muted); background: var(--surface-sunken); padding: 0.26rem 0.6rem; border-radius: 100px; }

  .scroll-hint {
    display: flex; flex-direction: column; align-items: center; gap: 0.3rem; margin: 2.2rem auto 0;
    font-size: 0.78rem; font-weight: 600; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .scroll-hint svg { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

  .deep-dive { border-top: 1px solid var(--line); padding: clamp(2rem, 5vw, 3.5rem) 0 clamp(3rem, 8vw, 5rem); }
  .deep-dive .dd-eyebrow { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 0.5rem; }
  .deep-dive h3 { font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 600; margin: 0 0 1.4rem; text-wrap: balance; }

  .diagram-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(1.2rem, 3vw, 2rem); margin-bottom: 1.6rem; overflow-x: auto; }
  .diagram-box svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .diagram-node-label { font-family: 'Work Sans', sans-serif; font-size: 12px; fill: var(--ink); font-weight: 600; }
  .diagram-sub-label { font-family: 'Work Sans', sans-serif; font-size: 10px; fill: var(--ink-muted); }

  .dd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(1.2rem, 3vw, 2.4rem); }
  .dd-grid p, .dd-grid li { font-size: 0.98rem; color: var(--ink); }
  .dd-grid ul { margin: 0; padding-left: 1.2rem; }
  .dd-grid h4 { font-family: var(--font-body); font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 0.5rem; }

  /* ---------- Closing slide ---------- */
  .closing-slide { text-align: center; }
  .closing-slide h2 { font-family: var(--font-display); font-size: clamp(2.2rem, 5vw, 3.4rem); margin: 0 0 0.8rem; }
  .closing-slide p { color: var(--ink-muted); font-size: 1.1rem; max-width: 46ch; margin: 0 auto 2rem; }
  .recap-row { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; max-width: 640px; margin: 0 auto; }
  .recap-pill { font-size: 0.82rem; font-weight: 600; padding: 0.4rem 0.9rem; border-radius: 100px; border: 1px solid var(--line); color: var(--ink-muted); }

  .fade-in { opacity: 0; transform: translateY(10px); animation: slideFadeUp 0.55s ease forwards; }
  @keyframes slideFadeUp { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .track { transition: none; }
    .fade-in { animation: none; opacity: 1; transform: none; }
    .scroll-hint svg { animation: none; }
  }

  @media (max-width: 760px) {
    .body-grid, .dd-grid { grid-template-columns: 1fr; }
    .nav-btn { width: 2.2rem; height: 2.2rem; }
  }
</style>

<div class="progress-bar" id="progress"></div>
<div class="counter" id="counter"></div>

<div class="deck"><div class="track" id="track"></div></div>

<button class="home-btn hidden" id="homeBtn">&larr; Overview</button>
<button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous slide">&larr;</button>
<button class="nav-btn nav-next" id="nextBtn" aria-label="Next slide">&rarr;</button>
<div class="dots" id="dots"></div>

let current = 0;
const total = slides.length;
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dotsWrap = document.getElementById('dots');
const homeBtn = document.getElementById('homeBtn');

slides.forEach((_, i) => {
  const d = document.createElement('button');
  d.className = 'dot';
  d.setAttribute('aria-label', `Go to slide ${i + 1}`);
  d.addEventListener('click', () => goTo(i));
  dotsWrap.appendChild(d);
});

function render() {
  track.style.transform = `translateX(-${current * 100}vw)`;
  progress.style.width = `${((current + 1) / total) * 100}%`;
  counter.textContent = `${current + 1} / ${total}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
  [...dotsWrap.children].forEach((d, i) => d.classList.toggle('active', i === current));
  homeBtn.classList.toggle('hidden', current === 0);

  const activeSlide = track.children[current];
  activeSlide.scrollTop = 0;
  activeSlide.querySelectorAll('.fade-in').forEach(el => {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  });
  activeSlide.querySelectorAll('[data-count]').forEach(el => animateCount(el));
}

function goTo(i) {
  current = Math.max(0, Math.min(total - 1, i));
  render();
}
prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));
homeBtn.addEventListener('click', () => goTo(0));
document.querySelectorAll('[data-goto]').forEach(btn => {
  btn.addEventListener('click', () => {
    const index = slides.findIndex(s => s.type === btn.dataset.goto);
    if (index !== -1) goTo(index);
  });
});
document.querySelectorAll('[data-jump]').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.jump;
    const firstIndex = slides.findIndex(s => s.type === 'project' && s.data.group === group);
    if (firstIndex !== -1) goTo(firstIndex);
  });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { e.preventDefault(); goTo(current + 1); }
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

function animateCount(el) {
  const target = parseFloat(el.dataset.target);
  const prefix = el.dataset.prefix || '';
  const suffix = el.dataset.suffix || '';
  const isDecimal = target % 1 !== 0;
  const duration = 800;
  const start = performance.now();
  function tick(now) {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const value = target * eased;
    el.textContent = prefix + (isDecimal ? value.toFixed(1) : Math.round(value).toLocaleString()) + suffix;
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

render();
